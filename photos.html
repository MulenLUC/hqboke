<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片墙</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --primary-dark: #3f37c9;
            --background-light: #f9fafc;
            --background-dark: #0f172a;
            --surface-light: rgba(255, 255, 255, 0.75);
            --surface-dark: rgba(30, 41, 59, 0.75);
            --text-light: #1e293b;
            --text-dark: #f1f5f9;
            --accent: #f72585;
            --transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        
        body {
            background: var(--background-light);
            color: var(--text-light);
            min-height: 100vh;
            transition: var(--transition);
            padding-top: 70px;
        }
        
        body.dark-theme {
            background: var(--background-dark);
            color: var(--text-dark);
        }
        
        /* 顶部导航栏 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            z-index: 100;
            transition: var(--transition);
        }
        
        .dark-theme .header {
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
        }
        
        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        
        .logo span {
            font-weight: 300;
            opacity: 0.8;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        
        .nav-btn {
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        
        .back-home {
            background: var(--primary);
            color: white;
        }
        
        .back-home:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
        }
        
        .theme-switcher {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        
        .dark-theme .theme-switcher {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .theme-switcher:hover {
            background: rgba(67, 97, 238, 0.1);
        }
        
        .dark-theme .theme-switcher:hover {
            background: rgba(247, 37, 133, 0.1);
        }
        
        /* 照片墙标题部分 */
        .gallery-header {
            text-align: center;
            padding: 80px 20px 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .gallery-title {
            font-size: 52px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .gallery-subtitle {
            font-size: 18px;
            line-height: 1.7;
            color: var(--text-light);
            opacity: 0.8;
            font-weight: 300;
        }
        
        .dark-theme .gallery-subtitle {
            color: var(--text-dark);
            opacity: 0.7;
        }
        
        /* 照片墙区域 */
        .photo-gallery {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        
        .photo-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            height: 350px;
            transition: var(--transition);
            cursor: pointer;
        }
        
        .photo-card:hover {
            transform: translateY(-10px);
        }
        
        .photo-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        .glass-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface-light);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            padding: 25px;
            transform: translateY(50px);
            opacity: 0;
            transition: var(--transition);
            z-index: 2;
        }
        
        .photo-card:hover .glass-panel {
            transform: translateY(0);
            opacity: 1;
        }
        
        .dark-theme .glass-panel {
            background: var(--surface-dark);
            border-top: 1px solid rgba(15, 23, 42, 0.5);
        }
        
        .photo-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-light);
        }
        
        .dark-theme .photo-title {
            color: var(--text-dark);
        }
        
        .photo-desc {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-light);
            opacity: 0.8;
        }
        
        .dark-theme .photo-desc {
            color: var(--text-dark);
        }
        
        .photo-index {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            z-index: 3;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: var(--transition);
        }
        
        .photo-card:hover .photo-index {
            transform: scale(1.1);
            background: var(--accent);
        }
        
        /* 页脚样式 */
        .footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 50px;
            font-size: 16px;
            color: var(--text-light);
            opacity: 0.7;
        }
        
        .dark-theme .footer {
            color: var(--text-dark);
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
            
            .photo-card {
                height: 300px;
            }
            
            .gallery-title {
                font-size: 42px;
            }
        }
        
        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            
            .photo-card {
                height: 400px;
            }
            
            .gallery-title {
                font-size: 36px;
            }
            
            .nav-buttons {
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }
            
            .nav-btn {
                width: 100%;
                justify-content: center;
            }
            
            .header .container {
                flex-direction: column;
                gap: 15px;
            }
            
            .gallery-header {
                padding: 40px 20px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="container">
            <a href="#" class="logo">照片墙·PHOTOS<span>Gallery</span></a>
            <div class="nav-buttons">
                <a href="index.html" class="nav-btn back-home">
                    <i class="fas fa-arrow-left"></i> 返回主页
                </a>
                <button id="themeToggle" class="nav-btn theme-switcher">
                    <i class="fas fa-moon"></i> 深色模式
                </button>
            </div>
        </div>
    </header>
    
    <!-- 照片墙标题区域 -->
    <section class="gallery-header">
        <h1 class="gallery-title">照片墙</h1>
        <p class="gallery-subtitle">回忆与未来。</p>
    </section>
    
    <!-- 照片墙区域 -->
    <main class="photo-gallery">
        <div class="gallery-grid">
            <!-- 照片卡片 1 -->
            <div class="photo-card">
                <img src="photos/1.jpg" alt="雨中的虎门大桥" class="photo-image">
                <div class="photo-index">1</div>
                <div class="glass-panel">
                    <h3 class="photo-title">雨中的虎门大桥</h3>
                    <p class="photo-desc">023年8月摄于东莞虎门，使用Redmi Note 12 Turbo拍摄。</p>
                </div>
            </div>
            
            <!-- 照片卡片 2 -->
            <div class="photo-card">
                <img src="photos/2.jpg" alt="都市脉动" class="photo-image">
                <div class="photo-index">2</div>
                <div class="glass-panel">
                    <h3 class="photo-title">都市脉动</h3>
                    <p class="photo-desc">深圳中心城区傍晚摄影，使用Redmi Note 12 Turbo拍摄。</p>
                </div>
            </div>
            
            <!-- 照片卡片 3 -->
            <div class="photo-card">
                <img src="photos/3.jpg" alt="天坛祈年殿" class="photo-image">
                <div class="photo-index">3</div>
                <div class="glass-panel">
                    <h3 class="photo-title">天坛祈年殿</h3>
                    <p class="photo-desc">天坛祈年殿摄影，使用Redmi Note 12 Turbo拍摄。</p>
                </div>
            </div>
            
            <!-- 照片卡片 4 -->
            <div class="photo-card">
                <img src="photos/4.jpg" alt="骊山" class="photo-image">
                <div class="photo-index">4</div>
                <div class="glass-panel">
                    <h3 class="photo-title">骊山</h3>
                    <p class="photo-desc">从秦始皇博物馆遥望骊山，由OPPO A9x拍摄。</p>
                </div>
            </div>
            
            <!-- 照片卡片 5 -->
            <div class="photo-card">
                <img src="photos/5.jpg" alt="路边风光" class="photo-image">
                <div class="photo-index">5</div>
                <div class="glass-panel">
                    <h3 class="photo-title">路边，不经意间的夕阳。</h3>
                    <p class="photo-desc">希望我们的故事能够继续。</p>
                </div>
            </div>
            
            
        </div>
    </main>
    
    <!-- 页脚 -->
    <footer class="footer">
        <p>© 2025 HQ 保留所有权利。</p>
        <p>投稿邮箱：3558612651@qq.com</p>
    </footer>
    
    <script>
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');
        
        // 检查本地存储的主题偏好
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            themeIcon.classList.remove('fa-moon');
            themeIcon.classList.add('fa-sun');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i> 浅色模式';
        }
        
        // 主题切换按钮事件
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            
            if (document.body.classList.contains('dark-theme')) {
                localStorage.setItem('theme', 'dark');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i> 浅色模式';
            } else {
                localStorage.setItem('theme', 'light');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i> 深色模式';
            }
        });
        
        // 卡片悬停效果增强
        const photoCards = document.querySelectorAll('.photo-card');
        photoCards.forEach(card => {
            card.addEventListener('mousemove', function(e) {
                const cardRect = this.getBoundingClientRect();
                const x = e.clientX - cardRect.left;
                const y = e.clientY - cardRect.top;
                
                const centerX = cardRect.width / 2;
                const centerY = cardRect.height / 2;
                
                const angleY = (x - centerX) / 25;
                const angleX = (centerY - y) / 25;
                
                const glass = this.querySelector('.glass-panel');
                
                if (glass.style.opacity === '1') {
                    this.style.transform = `translateY(-10px) rotateY(${angleY}deg) rotateX(${angleX}deg)`;
                    glass.style.transform = 'translateY(0)';
                }
            });
            
            card.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) rotateY(0) rotateX(0)';
            });
        });
    </script>
</body>
</html>
